[project]
name = "namelint"
version = "0.1.0"
description = "Reports where a Python function's name contradicts its body."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Abilian SAS" }]
keywords = ["linter", "naming", "ast", "static-analysis"]

# No runtime dependencies, and that is a design constraint rather than an
# accident: see notes/02-specs.md §7. The verb table is a build-time
# artefact shipped as package data.
dependencies = []

[project.scripts]
namelint = "namelint.cli:main"

[project.urls]
Homepage = "https://github.com/abilian/namelinter"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "nox>=2026.8.17",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/namelint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "E501",    # long lines are a judgement call, not a lint
    "S101",    # assert is how the tests assert
    "CPY001",  # no per-file copyright headers in this project
    "TC003",   # deferring stdlib typing imports buys startup time this
               # tool does not need, and costs `checks.py` its two-import rule
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "INP001"]
"tests/fixtures/**" = ["ALL"]
"tools/**" = ["INP001", "T201"]
"src/namelint/cli.py" = ["T201"]  # printing is what a CLI does
