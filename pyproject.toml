[project]
name = "namelint"
dynamic = ["version"]
description = "Reports where a Python function's name contradicts its body."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Abilian SAS" }]
keywords = ["linter", "naming", "ast", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# No runtime dependencies, and that is a design constraint rather than an
# accident: see notes/02-specs.md §7. The verb table is a build-time
# artefact shipped as package data.
dependencies = []

[project.scripts]
namelint = "namelint.cli:main"

[project.urls]
Homepage = "https://github.com/abilian/namelinter"
Repository = "https://github.com/abilian/namelinter"
Issues = "https://github.com/abilian/namelinter/issues"
Changelog = "https://github.com/abilian/namelinter/blob/main/CHANGES.md"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "nox>=2026.8.17",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One place for the version: `namelint.__version__`, which `--version`
# prints.
[tool.hatch.version]
path = "src/namelint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/namelint"]

# The sdist carries what a reader or a packager needs. `corpus/` is nine
# cloned repositories and `calibration/` is a measurement of them: both
# are reproducible from `tools/calibrate.py`, so neither ships.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "tools/",
    "notes/",
    "README.md",
    "CHANGES.md",
    "LICENSE",
    "Makefile",
    "noxfile.py",
    "ruff.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# Registered because `tests/conftest.py` applies them by directory; an
# unregistered mark warns on every run.
markers = [
    "unit: fast, isolated, no I/O",
    "integration: component interactions, file I/O",
]

# Ruff is configured in `ruff.toml`, which supersedes a `[tool.ruff]`
# table here wholesale: if both exist only `ruff.toml` is read. Keeping a
# second copy here would be config that looks live and is not.
