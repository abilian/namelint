image: alpine/latest
packages:
  - uv
  - gcc
  - python3-dev

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

sources:
  - git@git.sr.ht:~sfermigier/namelint

tasks:
  - install: |
      cd namelint
      uv sync
  - test: |
      cd namelint
      uv run pytest -q --tb=short
  - lint: |
      cd namelint
      uv run ruff check
      uv run ty check src
  - nox: |
      cd namelint
      uvx nox
